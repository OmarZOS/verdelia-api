# version: '3.8'

services:

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: /
    networks:
      - verdelia-net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    labels:
      - "traefik.enable=true"

      # Management UI over HTTPS
      - "traefik.http.routers.rabbitmq-ui.rule=Host(`rabbitmq.verdelia.com`)"
      - "traefik.http.routers.rabbitmq-ui.entrypoints=websecure"
      - "traefik.http.routers.rabbitmq-ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.rabbitmq-ui.loadbalancer.server.port=15672"

      # AMQP over TLS (TCP)
      - "traefik.tcp.routers.rabbitmq-amqps.rule=HostSNI(`amqp.verdelia.com`)"
      - "traefik.tcp.routers.rabbitmq-amqps.entrypoints=amqps"
      - "traefik.tcp.routers.rabbitmq-amqps.tls.certresolver=letsencrypt"
      - "traefik.tcp.services.rabbitmq-amqps.loadbalancer.server.port=5671"



  verdelia-web:
    container_name: verdelia-web
    hostname: verdelia-web
    build:
      context: ./landing
    image: verdelia-web:latest
    restart: unless-stopped
    ports:
      - 9070:9070
    networks:
      - verdelia-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.verdelia-web.rule=Host(`verdelia.com`)"
      - "traefik.http.routers.verdelia-web.entrypoints=websecure"
      - "traefik.http.routers.verdelia-web.tls=true"
      - "traefik.http.routers.verdelia-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.verdelia-web.loadbalancer.server.port=9070"

  verdelia-api:
    container_name: verdelia-api
    hostname: verdelia-api
    restart: unless-stopped
    build:
      context: api_server/
      args:
        - API_PORT=9000
    image: omarzos/verdelia-api
    environment:
      - API_PORT=9000
      - SQL_SCHEMA=${SQL_SCHEMA}
      - SQL_HOST=${SQL_HOST}
      - SQL_DATABASE=${SQL_DATABASE}
      - SQL_USER=${SQL_USER}
      - SQL_PASSWORD=${SQL_ROOT_PASSWORD}
      - SQL_PORT=${SQL_PORT}
      - AUTH_PORT=${AUTH_PORT}
      - AUTH_SERVER_NAME=${AUTH_SERVER_NAME}
      - AUTH_REGISTRATION_ENDPOINT=${AUTH_REGISTRATION_ENDPOINT}
      - AUTH_LOGIN_ENDPOINT=${AUTH_LOGIN_ENDPOINT}
      - AUTH_DELETE_ENDPOINT=${AUTH_DELETE_ENDPOINT}
      - ALGORITHM=${ALGORITHM}
      - API_SECRET_KEY=${SECRET_KEY}
      - FILE_UPLOAD_ENDPOINT=${FILE_UPLOAD_ENDPOINT}
      - FS_HOST=${FS_HOST}
      - FS_PORT=${FS_PORT}
      - API_FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      - API_FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
      - API_INSTAGRAM_CLIENT_ID=${INSTAGRAM_CLIENT_ID}
      - API_INSTAGRAM_CLIENT_SECRET=${INSTAGRAM_CLIENT_SECRET}
      - AUTH_CHANGE_ENDPOINT=${AUTH_CHANGE_ENDPOINT}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - BASE_URL=${BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
      - ENV_MODE="PRODUCTION"
    networks:
      - verdelia-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      - "traefik.enable=true"
      # - "traefik.docker.network=verdelia-net"  # Critical fix
      - "traefik.http.routers.verdelia-api.rule=Host(`verdelia.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.verdelia-api.entrypoints=websecure"
      - "traefik.http.routers.verdelia-api.tls=true"
      - "traefik.http.routers.verdelia-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.verdelia-api.loadbalancer.server.port=9000"

  verdelia-auth:
    container_name: verdelia-auth
    hostname: verdelia-auth
    restart: unless-stopped
    image: omarzos/verdelia-auth
    environment:
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - AUTH_PORT=9090
      - API_SECRET_KEY=${SECRET_KEY}
      - API_ALGORITHM=${ALGORITHM}
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
    networks:
      - verdelia-net
    volumes:
      - ./auth_db/:/auth_db/
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.verdelia-auth.rule=Host(`verdelia.com`) && PathPrefix(`/auth`)"
      - "traefik.http.routers.verdelia-auth.entrypoints=websecure"
      - "traefik.http.routers.verdelia-auth.tls=true"
      - "traefik.http.routers.verdelia-auth.tls.certresolver=letsencrypt"
      - "traefik.http.services.verdelia-auth.loadbalancer.server.port=9090"

  verdelia-fs:
    container_name: verdelia-fs
    hostname: verdelia-fs
    restart: unless-stopped
    image: omarzos/verdelia-fs
    environment:
      - FS_PORT=9099
    networks:
      - verdelia-net
    volumes:
      - ./fs/:/fs/
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.verdelia-fs.rule=Host(`verdelia.com`) && PathPrefix(`/fs`)"
      - "traefik.http.routers.verdelia-fs.entrypoints=websecure"
      - "traefik.http.routers.verdelia-fs.tls=true"
      - "traefik.http.routers.verdelia-fs.tls.certresolver=letsencrypt"
      - "traefik.http.services.verdelia-fs.loadbalancer.server.port=9099"

  verdelia-stream:
    container_name: verdelia-stream
    image: omarzos/verdelia-stream
    restart: unless-stopped
    command: uvicorn server:app --host 0.0.0.0 --port 9097
    environment:
      - AMQP_HOST=${AMQP_HOST}
      - AMQP_PORT=${AMQP_PORT}
      - AMQP_VIRTUAL_HOST=${AMQP_VIRTUAL_HOST}
      - AMQP_USER=${AMQP_USER}
      - AMQP_PASS=${AMQP_PASS}
    networks:
      - verdelia-net
    labels:
      - "traefik.enable=true"

      # FIXED (no useless middlewares)
      - "traefik.http.routers.verdelia-stream.rule=Host(`verdelia.com`) && PathPrefix(`/stream`)"
      - "traefik.http.routers.verdelia-stream.entrypoints=websecure"
      - "traefik.http.routers.verdelia-stream.tls=true"
      - "traefik.http.routers.verdelia-stream.tls.certresolver=letsencrypt"
      - "traefik.http.services.verdelia-stream.loadbalancer.server.port=9097"


      # WebSocket support


  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    command:
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.amqps.address=:5671"

      # Redirect HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      # API Dashboard (keep insecure only if local or protected)
      - "--api.insecure=true"

      # LETS ENCRYPT — HTTP CHALLENGE (no Cloudflare needed)
      - "--certificatesresolvers.letsencrypt.acme.email=osjfvhng16@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # dashboard
      - "5671:5671"  # AMQPS
    networks:
      - verdelia-net
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"



volumes:
  rabbitmq_data:
    driver: local
  rabbitmq_logs:
    driver: local

networks:
  verdelia-net:
    name: verdelia-net
    driver: bridge
    attachable: true